name: Update election results

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Save raw fetched documents as a downloadable artifact"
        type: boolean
        default: false
  schedule:
    # Plain every-5-minutes schedule (GitHub honors simple crons far more reliably than
    # day/month-restricted ones). A step below exits early outside the election window.
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1

      - name: Install dependencies
        run: |
          pip install --quiet requests beautifulsoup4 lxml playwright
          python -m playwright install --with-deps chromium > /dev/null 2>&1 || python -m playwright install chromium

      - name: Skip outside the election window (Nov 3 22:00 UTC → Nov 7 00:00 UTC)
        id: window
        run: |
          now=$(date -u +%s); start=$(date -u -d "2026-11-03 22:00:00" +%s); end=$(date -u -d "2026-11-07 00:00:00" +%s)
          if [ "${{ github.event_name }}" = "schedule" ] && { [ "$now" -lt "$start" ] || [ "$now" -gt "$end" ]; }; then echo "run=false" >> $GITHUB_OUTPUT; else echo "run=true" >> $GITHUB_OUTPUT; fi

      - name: Fetch results
        if: steps.window.outputs.run == 'true'
        run: |
          if [ "${{ inputs.probe }}" = "true" ]; then
            python3 scripts/fetch_results.py --probe
          else
            python3 scripts/fetch_results.py
          fi

      - name: Commit results
        if: steps.window.outputs.run == 'true'
        run: |
          git config user.name "results-bot"
          git config user.email "results-bot@users.noreply.github.com"
          git add data/results.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "results: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push
          fi

      - name: Publish probe output to probe-data branch
        if: ${{ inputs.probe }}
        run: |
          set -e
          [ -d probe ] || { echo "no probe output"; exit 0; }
          git config user.name "results-bot"
          git config user.email "results-bot@users.noreply.github.com"
          tmp=$(mktemp -d)
          cp -r probe/. "$tmp"/
          git fetch origin probe-data || true
          git checkout -B probe-data
          git rm -rq --cached . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r "$tmp"/. .
          git add -A
          git commit -m "probe $(date -u +'%Y-%m-%d %H:%M UTC')" || true
          git push -f origin probe-data
