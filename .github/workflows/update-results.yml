name: Update election results

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Save raw fetched documents as a downloadable artifact"
        type: boolean
        default: false
  schedule:
    # GitHub cron is UTC. Election night Nov 3, 2026 (CT = UTC-6 after Nov 1 DST change).
    # 6:00 PM CT Nov 3 = 00:00 UTC Nov 4. Poll every 5 min from 5 PM CT Nov 3 through 6 AM CT Nov 4,
    # then every 30 min through Nov 6 for late counting (TX/MT/FL mail ballots, VA provisionals).
    - cron: "*/5 23 3 11 *"
    - cron: "*/5 0-11 4 11 *"
    - cron: "*/30 12-23 4 11 *"
    - cron: "*/30 * 5-6 11 *"

permissions:
  contents: write

concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests beautifulsoup4 lxml

      - name: Fetch results
        run: |
          if [ "${{ inputs.probe }}" = "true" ]; then
            python3 scripts/fetch_results.py --probe
          else
            python3 scripts/fetch_results.py
          fi

      - name: Upload probe artifact
        if: ${{ inputs.probe }}
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ github.run_id }}
          path: probe/
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit results
        run: |
          git config user.name "results-bot"
          git config user.email "results-bot@users.noreply.github.com"
          git add data/results.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "results: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push
          fi
